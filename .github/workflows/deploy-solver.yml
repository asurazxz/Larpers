# Deploys the solver API to a Hugging Face Docker Space (deploy/hf-space/deploy.py).
# Needs the repository secret HF_TOKEN (a Hugging Face token with write access). GEMINI_API_KEY is optional.
name: Deploy solver

on:
    push:
        branches: [main, claude/osrm-supply-depot-routes]
        paths:
            - api/**
            - solver/**
            - contracts/**
            - data/**
            - prototype/osrm_table_84.json
            - requirements.txt
            - deploy/hf-space/**
            - .github/workflows/deploy-solver.yml
    workflow_dispatch:

concurrency:
    group: deploy-solver
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            # Without the token, skip the deploy with a warning instead of failing the run.
            - name: Check for the token
              id: token
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  if [ -z "$HF_TOKEN" ]; then
                      echo "::warning::Deploy skipped: add the repository secret HF_TOKEN (Settings > Secrets and variables > Actions), then re-run this workflow."
                      echo "present=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: steps.token.outputs.present == 'true'
              uses: actions/checkout@v4
            - if: steps.token.outputs.present == 'true'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - if: steps.token.outputs.present == 'true'
              run: pip install -U huggingface_hub
            - if: steps.token.outputs.present == 'true'
              run: python deploy/hf-space/deploy.py
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
