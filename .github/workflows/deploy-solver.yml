# Deploys the solver API to a Hugging Face Docker Space (deploy/hf-space/deploy.py).
# Needs the repository secret HF_TOKEN (a Hugging Face token with write access). GEMINI_API_KEY is optional.
name: Deploy solver

on:
    push:
        branches: [main, claude/osrm-supply-depot-routes]
        paths:
            - api/**
            - solver/**
            - contracts/**
            - data/**
            - prototype/osrm_table_84.json
            - requirements.txt
            - deploy/hf-space/**
            - .github/workflows/deploy-solver.yml
    workflow_dispatch:

concurrency:
    group: deploy-solver
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Check for the token
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: |
                  if [ -z "$HF_TOKEN" ]; then
                      echo "::error::Add the repository secret HF_TOKEN (Settings > Secrets and variables > Actions), then re-run this workflow."
                      exit 1
                  fi
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -U huggingface_hub
            - run: python deploy/hf-space/deploy.py
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
